else if(k=='jt'){const ci=+g[1],r=+g[2],q=JC[ci].q[r],j=GM.j;j.cur={ci,r,o:sh([q[1],...q[2]])};$('#jq').innerHTML=`<div class="panel"><span class="lbl">${JC[ci].n} for $${(r+1)*100}</span><h3>${q[0]}</h3>${j.cur.o.map((o,i)=>`<button class="opt" data-g="ja:${o==q[1]?1:0}">${o}</button>`).join('')}</div>`;document.querySelectorAll('.jt').forEach(b=>b.disabled=true)}

V.about=()=>crumb(['About'])+`<span class="badge">✦ Concept Prototype</span><h2 style="margin-top:10px">About this prototype</h2><p class="sub">Proposed by Deanna Parker. A working example of what a shared Print Quality and Customer Care hub could look like. Everything here is fictional and would be replaced with approved content.</p>
<div class="grid" style="margin-top:20px"><div class="card t3"><span class="lbl">The problem (hypothesis)</span><h3>Answers live in many places</h3><p>When knowledge is scattered, specialists may spend time searching, asking the same questions, and explaining things slightly differently each time.</p></div>
<div class="card t2"><span class="lbl">The idea</span><h3>One interactive hub</h3><p>Troubleshooting flows, quick fixes, customer conversation practice and escalation guidance together in one searchable place.</p></div>
<div class="card t1"><span class="lbl">Why it could help</span><h3>Faster, more consistent</h3><p>New specialists ramp up with practice, experienced ones find answers quickly, and customers get clearer, calmer explanations.</p></div></div>
<h2 class="sec" style="margin-top:44px">Pilot plan</h2><p class="sub">A small, low-risk way to find out whether this works. Timeline and measures are suggestions for discussion.</p>
<div class="panel"><div class="bar"><i style="width:100%"></i></div>
<details open><summary>Week 1: Baseline</summary><div><ul><li>Ask a few specialists how long it takes to find an answer today</li><li>Note the most repeated questions</li><li>Agree on what content is approved for use</li></ul></div></details>
<details><summary>Weeks 2 and 3: Small pilot</summary><div><ul><li>Replace fictional content with approved material for the top issues</li><li>A handful of specialists use it during real work</li><li>Collect "Did this help?" feedback and Idea Lab suggestions</li></ul></div></details>
<details><summary>Week 4: Review</summary><div><ul><li>Compare time to find an answer against the baseline</li><li>Review which topics were used and which were missing</li><li>Decide together: expand, adjust or stop</li></ul></div></details></div>
<div class="two"><div class="panel"><span class="lbl">How we would measure it</span><ul class="chk"><li>Time to find an answer</li><li>Article usefulness ratings</li><li>Repeat questions to teammates</li><li>New specialist confidence</li></ul></div>
<div class="panel"><span class="lbl">What it would need</span><ul class="chk"><li>Approved content and an owner for it</li><li>A review step for accuracy</li><li>A few volunteer pilot users</li><li>Honest feedback</li></ul></div></div>
<div class="diag">The sample metrics on the home page are fictional demonstration numbers. A real pilot would replace them with measured results.</div>
<div class="panel t2"><h3>The ask</h3><p>Try it for a month, tell me what is missing, and help decide whether it earns a place on the team. I would love to keep building it.</p><button class="btn" data-go="home">Back to the hub</button></div>`;
